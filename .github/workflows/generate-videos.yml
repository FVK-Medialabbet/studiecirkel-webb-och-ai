name: Generate video snippets and update videobank

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-videos:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests

      - name: Generate snippets and update videobank
        run: |
          python scripts/generate_videos.py

      - name: Commit and push changes (if any)
        run: |
          if git diff --quiet; then
            echo "Inga ändringar att committa."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/videobank.md docs/includes/videos || true
          git commit -m "Update videobank and video snippets"
          git push
